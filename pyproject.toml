[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bounded-coding-agent"
version = "0.7.2"
description = "A small, controller-driven coding agent for local repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Candidate" }]
dependencies = []

[project.scripts]
coding-agent = "coding_agent.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

